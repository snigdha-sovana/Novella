{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">📊 Update Progress for {{ book.title }}</h2>

<div class="card shadow-sm p-4">
    <form method="POST" action="{{ url_for('library.update_progress', userbook_id=userbook.id) }}">
        {{ form.hidden_tag() }}

        <!-- Pages Progress -->
        <div class="mb-3">
            <label for="pagesRead" class="form-label">Pages Read</label>
            <input type="range" class="form-range" id="pagesRead" name="pages_read"
                   min="0" max="{{ book.pages }}" value="{{ userbook.pages_read }}">
            <div><strong><span id="pagesReadOutput">{{ userbook.pages_read }}</span></strong> / {{ book.pages }}</div>
        </div>

        <!-- Chapters Progress -->
        <div class="mb-3">
            <label for="chaptersRead" class="form-label">Chapters Read</label>
            <input type="range" class="form-range" id="chaptersRead" name="chapters_read"
                   min="0" max="{{ book.chapters }}" value="{{ userbook.chapters_read }}">
            <div><strong><span id="chaptersReadOutput">{{ userbook.chapters_read }}</span></strong> / {{ book.chapters }}</div>
        </div>

        <button type="submit" class="btn btn-primary">💾 Save Progress</button>
        <a href="{{ url_for('library.my_library') }}" class="btn btn-secondary">Back</a>
    </form>
</div>

<!-- Progress Script -->
<script src="{{ url_for('static', filename='js/progress.js') }}"></script>
{% endblock %}
