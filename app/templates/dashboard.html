{% extends "layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-4">📊 Dashboard</h2>
        <p class="lead">Welcome back, {{ current_user.username }}!</p>
    </div>
</div>

<div class="row g-4 mt-3">
    <div class="col-md-4">
        <div class="card shadow p-3">
            <h5>Total Books Read</h5>
            <p class="display-6">{{ total_books }}</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow p-3">
            <h5>Completed Books</h5>
            <p class="display-6">{{ completed_books }}</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow p-3">
            <h5>Ongoing Books</h5>
            <p class="display-6">{{ reading_books }}</p>
        </div>
    </div>
</div>

<div class="mt-5 text-center">
    <a href="{{ url_for('library.personal_library') }}" class="btn btn-primary btn-lg">Go to My Library</a>
</div>
{% endblock %}
