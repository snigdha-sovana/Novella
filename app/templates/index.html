{% extends "layout.html" %}
{% block content %}
<div class="text-center py-5">
    <h1 class="fw-bold">Welcome to Book Journal 📖</h1>
    <p class="lead">Track your reading, share your thoughts, and connect with other book lovers.</p>

    {% if current_user.is_authenticated %}
        <a href="{{ url_for('library.personal_library') }}" class="btn btn-primary btn-lg mt-3">Go to My Library</a>
    {% else %}
        <a href="{{ url_for('auth.signup') }}" class="btn btn-success btn-lg mt-3">Get Started</a>
    {% endif %}
</div>
{% endblock %}
