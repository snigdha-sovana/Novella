{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">📚 Explore Books</h2>

<form method="GET" action="{{ url_for('main.explore') }}" class="mb-4">
    <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Search by title, author, or genre" value="{{ request.args.get('q', '') }}">
        <button class="btn btn-outline-primary">Search</button>
    </div>
</form>

<div class="row g-4">
    {% for book in books %}
    <div class="col-md-3">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ book.title }}</h5>
                <p class="card-text text-muted">by {{ book.author }}</p>
                <p><span class="badge bg-info">{{ book.genre }}</span></p>
                <a href="{{ url_for('main.book_detail', book_id=book.id) }}" class="btn btn-sm btn-outline-primary">View Details</a>
            </div>
        </div>
    </div>
    {% else %}
    <p class="text-muted">No books found.</p>
    {% endfor %}
</div>
{% endblock %}
