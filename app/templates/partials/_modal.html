<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" id="modal-close">&times;</span>
    <div id="modal-body">
      <!-- Content will be switched based on use case -->
    </div>
  </div>
</div>

<script>
// --- Modal Controls ---
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modal-body");
const closeBtn = document.getElementById("modal-close");

closeBtn.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

// --- Use Case 1: Book Details Preview ---
function openBookDetails(bookId, title, author, genre, pages, chapters) {
  modalBody.innerHTML = `
    <h3>${title}</h3>
    <p><em>by ${author}</em></p>
    <p>Genre: ${genre}</p>
    <p>Pages: ${pages} | Chapters: ${chapters}</p>
    <a href="/book/${bookId}" class="btn">View Full Details</a>
  `;
  modal.style.display = "block";
}

// --- Use Case 2: Update Progress ---
function openProgressModal(bookId, pagesRead, totalPages, chaptersRead, totalChapters) {
  modalBody.innerHTML = `
    <h3>📖 Update Progress</h3>
    <form method="POST" action="/library/${bookId}/progress">
      <label for="pages">Pages Read:</label>
      <input type="number" name="pages" value="${pagesRead}" max="${totalPages}" class="form-control" required>
      <label for="chapters">Chapters Read:</label>
      <input type="number" name="chapters" value="${chaptersRead}" max="${totalChapters}" class="form-control" required>
      <button type="submit" class="btn">Update</button>
    </form>
    <p>Currently: ${pagesRead}/${totalPages} pages | ${chaptersRead}/${totalChapters} chapters</p>
  `;
  modal.style.display = "block";
}

// --- Use Case 3: Journal Entry ---
function openJournalModal(bookId) {
  modalBody.innerHTML = `
    <h3>📝 Add Journal Entry</h3>
    <form method="POST" action="/journals/${bookId}/add">
      <label for="experience">Your Experience:</label>
      <textarea name="experience" class="form-control" required></textarea>
      <label for="review">Your Review:</label>
      <textarea name="review" class="form-control" required></textarea>
      <button type="submit" class="btn">Save Entry</button>
    </form>
  `;
  modal.style.display = "block";
}
</script>
